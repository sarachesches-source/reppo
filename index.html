<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Reppo</title>
    <meta
      name="description"
      content="Gym tracker that lifts by how rested you feel, with guided recovery routines."
    />
    <meta name="theme-color" content="#0f1115" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Reppo" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <main id="main"></main>
      <div id="timer" role="timer" aria-live="off">
        <span class="num" id="tclock">0:00</span>
        <span class="sub" id="tlabel" style="flex: 1">Rest</span>
        <button class="btn small" data-act="t-add" data-v="-15" aria-label="15 seconds less">−15</button>
        <button class="btn small" data-act="t-add" data-v="15" aria-label="15 seconds more">+15</button>
        <button class="btn small ghost" data-act="t-stop">Skip</button>
        <i class="bar" id="tbar"></i>
      </div>
      <nav aria-label="Sections">
        <button data-tab="train">
          <svg viewBox="0 0 24 24"><path d="M3 9v6M6.5 6.5v11M17.5 6.5v11M21 9v6M6.5 12h11" /></svg>Train
        </button>
        <button data-tab="recover">
          <svg viewBox="0 0 24 24">
            <path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" /></svg
          >Recover
        </button>
        <button data-tab="progress">
          <svg viewBox="0 0 24 24"><path d="M3 20h18M5 15l4-5 4 3 6-8" /></svg>Progress
        </button>
        <button data-tab="history">
          <svg viewBox="0 0 24 24">
            <rect x="3.5" y="5" width="17" height="15" rx="2.5" />
            <path d="M3.5 10h17M8 3v4M16 3v4" /></svg
          >History
        </button>
        <button data-tab="more">
          <svg viewBox="0 0 24 24">
            <circle cx="5" cy="12" r="1.3" />
            <circle cx="12" cy="12" r="1.3" />
            <circle cx="19" cy="12" r="1.3" /></svg
          >More
        </button>
      </nav>
    </div>
    <div id="sheet" role="dialog" aria-modal="true" aria-label="Add exercise">
      <div class="inner" id="sheetInner"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
